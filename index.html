        // ================================================================
        // CARTRIDGE MODULE - PROFESSIONAL
        // ================================================================
        let CARTRIDGE_CACHE = [];

        async function viewCartridges(c) {
            CARTRIDGE_CACHE = await allCartridges();
            const printers = (await allDevices()).filter(d => d.type === 'printer');

            
            
            // ساخت مپ برای تبدیل شناسه پرینتر به نام
            const printerMap = {};
            for (const p of printers) {
                printerMap[p.id] = p.name || p.id;
            }

            // Build filter options
            const statusOpts = Object.keys(CARTRIDGE_STATUS).map(k =>
                `<option value="${k}" ${STATE.cartStatusFilter === k ? 'selected' : ''}>${CARTRIDGE_STATUS[k].label}</option>`
            ).join('');
            const printerOpts = printers.map(p =>
                `<option value="${p.id}" ${STATE.cartPrinterFilter === p.id ? 'selected' : ''}>${esc(p.name || p.id)}</option>`
            ).join('');

            // Sort and filter
            let filtered = [...CARTRIDGE_CACHE];
            if (STATE.cartSearch) {
                const q = STATE.cartSearch.toLowerCase();
                filtered = filtered.filter(c =>
                    (c.serialNumber || '').toLowerCase().includes(q) ||
                    (c.model || '').toLowerCase().includes(q) ||
                    (c.brand || '').toLowerCase().includes(q) ||
                    (c.currentLocation || '').toLowerCase().includes(q)
                );
            }
            if (STATE.cartStatusFilter) {
                filtered = filtered.filter(c => c.currentStatus === STATE.cartStatusFilter);
            }
            if (STATE.cartPrinterFilter) {
                filtered = filtered.filter(c => c.currentPrinterId === STATE.cartPrinterFilter);
            }
            // sorting
            const { key, dir } = STATE.cartSort;
            filtered.sort((a, b) => {
                let av = a[key] || '',
                    bv = b[key] || '';
                if (typeof av === 'string') av = av.toLowerCase();
                if (typeof bv === 'string') bv = bv.toLowerCase();
                if (av < bv) return dir === 'asc' ? -1 : 1;
                if (av > bv) return dir === 'asc' ? 1 : -1;
                return 0;
            });

            // Build table rows
            let rows = '';
            for (const cart of filtered) {
                const stats = await getCartridgeStats(cart.id);
                const printer = printers.find(p => p.id === cart.currentPrinterId);
                const lastOp = stats.lastOperation;
                const lastOpDate = lastOp ? fmtDate(lastOp.date) : '—';
                
                // تبدیل شناسه‌های پرینتر به نام
                const compatNames = (cart.compatiblePrinters || [])
                    .map(id => printerMap[id] || id)
                    .join('، ');
                
                rows += `<tr class="row-link" data-id="${cart.id}">
                    <td>${esc(cart.serialNumber || '')}</td>
                    <td>${esc(cart.model || '')}</td>
                    <td>${esc(compatNames)}</td>
                    <td>${printer ? esc(printer.name) : '—'}</td>
                    <td>${cartridgeStatusBadge(cart.currentStatus)}</td>
                    <td>${stats.rechargeCount}</td>
                    <td>${lastOpDate}</td>
                    <td class="actions-cell no-print">
                        <button class="btn-icon" data-action="viewCart" data-id="${cart.id}">${icon('eye')}</button>
                        <button class="btn-icon" data-action="editCart" data-id="${cart.id}">${icon('edit')}</button>
                        <button class="btn-icon" data-action="delCart" data-id="${cart.id}" style="color:var(--bad);">${icon('trash')}</button>
                    </td>
                </tr>`;
            }

            c.innerHTML = `
                <div class="view">
                    <div class="toolbar">
                        <div class="search-box">${icon('search')}<input id="cartSearch" class="input" placeholder="جستجوی سریال، مدل، برند..." value="${esc(STATE.cartSearch)}"><span class="kbd-hint">/</span></div>
                        <div class="right">
                            <button class="btn btn-primary" id="addCartridge">${icon('plus')}افزودن کارتریج</button>
                            <button class="btn btn-secondary btn-sm" id="toggleCartFilter">${icon('filter')}فیلتر</button>
                        </div>
                    </div>
                    <div class="filter-accordion" id="cartFilterAccordion" style="display:${(STATE.cartStatusFilter || STATE.cartPrinterFilter) ? 'flex' : 'none'}">
                        <div class="fgroup"><label>وضعیت:</label><select id="cartStatusFilter" class="select filter-select"><option value="">همه</option>${statusOpts}</select></div>
                        <div class="fgroup"><label>پرینتر:</label><select id="cartPrinterFilter" class="select filter-select"><option value="">همه</option>${printerOpts}</select></div>
                        <button class="btn btn-secondary btn-sm" id="clearCartFilters">${icon('x')}پاک کردن</button>
                    </div>
                    <div class="table-wrap">
                        <table class="tbl">
                            <thead>
                                <tr>
                                    ${thCart('serialNumber', 'سریال')}
                                    ${thCart('model', 'مدل')}
                                    <th>سازگار با</th>
                                    ${thCart('currentPrinterId', 'پرینتر فعلی')}
                                    ${thCart('currentStatus', 'وضعیت')}
                                    <th>تعداد شارژ</th>
                                    <th>آخرین عملیات</th>
                                    <th style="text-align:left;">عملیات</th>
                                </tr>
                            </thead>
                            <tbody>${rows || `<tr><td colspan="8"><div class="empty">${icon('cartridges')}<div class="et">هیچ کارتریجی ثبت نشده</div></div></td></tr>`}</tbody>
                        </table>
                        <div class="table-footer no-print"><span>${filtered.length} مورد</span></div>
                    </div>
                </div>
            `;

            // Event listeners
            const searchInput = $('#cartSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    STATE.cartSearch = this.value;
                    viewCartridges(c);
                });
            }
            const statusFilter = $('#cartStatusFilter');
            if (statusFilter) {
                statusFilter.addEventListener('change', function() {
                    STATE.cartStatusFilter = this.value;
                    viewCartridges(c);
                });
            }
            const printerFilter = $('#cartPrinterFilter');
            if (printerFilter) {
                printerFilter.addEventListener('change', function() {
                    STATE.cartPrinterFilter = this.value;
                    viewCartridges(c);
                });
            }
            const clearFilters = $('#clearCartFilters');
            if (clearFilters) {
                clearFilters.addEventListener('click', function() {
                    STATE.cartStatusFilter = '';
                    STATE.cartPrinterFilter = '';
                    STATE.cartSearch = '';
                    viewCartridges(c);
                });
            }
            const toggleFilter = $('#toggleCartFilter');
            if (toggleFilter) {
                toggleFilter.addEventListener('click', function() {
                    const acc = $('#cartFilterAccordion');
                    if (acc) acc.style.display = acc.style.display === 'none' ? 'flex' : 'none';
                });
            }
            const addBtn = $('#addCartridge');
            if (addBtn) addBtn.addEventListener('click', function() { openCartridgeForm(null); });

            // Sortable headers
            $$('.tbl thead th.sortable', c).forEach(th => {
                th.addEventListener('click', function() {
                    const key = this.dataset.key;
                    if (STATE.cartSort.key === key) {
                        STATE.cartSort.dir = STATE.cartSort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        STATE.cartSort.key = key;
                        STATE.cartSort.dir = 'asc';
                    }
                    viewCartridges(c);
                });
            });

            // Row actions
            $$('[data-action="viewCart"]', c).forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openCartridgeDetail(this.dataset.id);
                });
            });
            $$('[data-action="editCart"]', c).forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openCartridgeForm(this.dataset.id);
                });
            });
            $$('[data-action="delCart"]', c).forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    confirmDeleteCartridge(this.dataset.id);
                });
            });
            $$('tr.row-link', c).forEach(tr => {
                tr.addEventListener('click', function() {
                    if (this.dataset.id) openCartridgeDetail(this.dataset.id);
                });
            });
        }

        function thCart(key, label) {
            const s = STATE.cartSort;
            const sorted = s.key === key ? 'sorted' : '';
            const arrow = (s.key === key) ? (s.dir === 'asc' ? icon('chevU') : icon('chevD')) : '';
            return `<th class="sortable ${sorted}" data-key="${key}">${label}<span class="sort-ico">${arrow}</span></th>`;
        }

        // --- CARTRIDGE FORM ---
        async function openCartridgeForm(id) {
            try {
                const cart = await getCartridge(id) || {
                    serialNumber: '',
                    model: '',
                    brand: '',
                    compatiblePrinters: [],
                    purchaseDate: '',
                    warrantyDate: '',
                    currentStatus: 'ready',
                    currentPrinterId: null,
                    currentLocation: '',
                    description: ''
                };
                const isNew = !id;
                const root = $('#modalRoot');

                const statusOpts = Object.keys(CARTRIDGE_STATUS).map(k =>
                    `<option value="${k}" ${cart.currentStatus === k ? 'selected' : ''}>${CARTRIDGE_STATUS[k].label}</option>`
                ).join('');

                const devs = await allDevices();
                console.log('همه دیوایس‌ها:', devs); // بررسی کنید که آیا دیوایس‌ها وجود دارند
                
                const printers = devs.filter(d => d.type === 'printer');
                console.log('پرینترهای یافت شده:', printers); // آیا پرینتری وجود دارد؟
                
                if (printers.length === 0) {
                    toast('هیچ پرینتری در سیستم ثبت نشده است. لطفاً ابتدا یک پرینتر اضافه کنید.', 'warn');
                }

                const printerOpts = printers.map(p =>
                    `<option value="${p.id}" ${cart.currentPrinterId === p.id ? 'selected' : ''}>${esc(p.name || p.id)}</option>`
                ).join('');

                const compatOpts = printers.map(p =>
                    `<option value="${p.id}" ${(cart.compatiblePrinters || []).includes(p.id) ? 'selected' : ''}>${esc(p.name || p.id)}</option>`
                ).join('');

                console.log('compatOpts:', compatOpts); // آیا گزینه‌ها ساخته می‌شوند؟
                                
                                // ساخت چک‌باکس‌های پرینترهای سازگار
                const compatCheckboxes = printers.map(p => {
                    const checked = (cart.compatiblePrinters || []).includes(p.id) ? 'checked' : '';
                    return `<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 8px;cursor:pointer;font-size:13px;">
                        <input type="checkbox" class="compat-check" value="${p.id}" ${checked}> ${esc(p.name)}
                    </label>`;
                }).join('') || 'هیچ پرینتری یافت نشد';

                root.innerHTML = `
                    <div class="modal-backdrop" id="cartBackdrop">
                        <div class="modal" style="max-width:720px;" onclick="event.stopPropagation()">
                            <div class="modal-head">
                                <div class="mh-ico">${icon(isNew ? 'plus' : 'edit')}</div>
                                <div><h3>${isNew ? 'افزودن کارتریج جدید' : 'ویرایش کارتریج'}</h3><div class="sp">${isNew ? 'ثبت کارتریج' : 'ویرایش اطلاعات'}</div></div>
                                <button class="btn-icon x" id="cartClose">${icon('x')}</button>
                            </div>
                            <div class="modal-body">
                                <div class="form-grid">
                                    ${field('شماره سریال', 'cart_serial', 'یکتا')}
                                    ${field('مدل', 'cart_model', 'مثلاً HP85A')}
                                    ${field('برند', 'cart_brand', 'مثلاً HP')}
                                    <div class="field">
                                        <label>پرینترهای سازگار</label>
                                        <div class="field">
                                            <div id="cartCompatContainer" style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--surface-2);border-radius:8px;border:1px solid var(--border);min-height:50px;">
                                                ${compatCheckboxes}
                                            </div>
                                            <div class="hint">برای انتخاب چند مورد، روی هرکدام کلیک کنید.</div>
                                        </div>
                                    </div>
                                    ${dateFieldF('تاریخ خرید', 'cart_purchase', cart.purchaseDate)}
                                    ${dateFieldF('تاریخ گارانتی', 'cart_warranty', cart.warrantyDate)}
                                    <div class="field"><label>وضعیت</label><select id="cart_status" class="select">${statusOpts}</select></div>
                                    <div class="field"><label>پرینتر فعلی</label><select id="cart_printer" class="select"><option value="">هیچ‌کدام</option>${printerOpts}</select></div>
                                    ${field('محل فعلی', 'cart_location', 'مکان فیزیکی')}
                                    <div class="field span-2"><label>توضیحات</label><textarea id="cart_desc" class="input" placeholder="توضیحات تکمیلی…">${esc(cart.description || '')}</textarea></div>
                                </div>
                            </div>
                            <div class="modal-foot">
                                <button class="btn btn-primary" id="saveCart">${icon('check')}ذخیره</button>
                                <button class="btn btn-secondary" id="cancelCart">انصراف</button>
                            </div>
                        </div>
                    </div>
                `;

                // مقداردهی فیلدها
                setVal('cart_serial', cart.serialNumber);
                setVal('cart_model', cart.model);
                setVal('cart_brand', cart.brand);
                setVal('cart_purchase', cart.purchaseDate);
                setVal('cart_warranty', cart.warrantyDate);
                setVal('cart_location', cart.currentLocation);
                setVal('cart_desc', cart.description);
                const statusSel = $('#cart_status');
                if (statusSel) statusSel.value = cart.currentStatus || 'ready';
                const printerSel = $('#cart_printer');
                if (printerSel) printerSel.value = cart.currentPrinterId || '';
                const compatSel = $('#cart_compat');
                if (compatSel) {
                    const compat = cart.compatiblePrinters || [];
                    for (const opt of compatSel.options) {
                        opt.selected = compat.includes(opt.value);
                    }
                }

                // رویدادهای مودال
                const backdrop = $('#cartBackdrop');
                if (backdrop) backdrop.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
                const closeBtn = $('#cartClose');
                if (closeBtn) closeBtn.addEventListener('click', closeModal);
                const cancelBtn = $('#cancelCart');
                if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

                const saveBtn = $('#saveCart');
                if (saveBtn) {
                    saveBtn.addEventListener('click', async function(e) {
                        e.preventDefault();
                        try {
                            console.log('ذخیره کارتریج شروع شد...');
                            const serial = val('cart_serial').trim();
                            if (!serial) {
                                toast('شماره سریال الزامی است.', 'err');
                                return;
                            }
                            // بررسی یکتا بودن سریال
                            const existing = await getCartridgeBySerial(serial);
                            if (existing && existing.id !== cart.id) {
                                toast('شماره سریال تکراری است.', 'err');
                                return;
                            }
                            const model = val('cart_model');
                            const brand = val('cart_brand');
                            const purchase = val('cart_purchase');
                            const warranty = val('cart_warranty');
                            const status = $('#cart_status').value;
                            const printer = $('#cart_printer').value || null;
                            const location = val('cart_location');
                            const desc = val('cart_desc');
                            
                            // پرینترهای سازگار از چک‌باکس‌ها
                            const compat = [];
                            document.querySelectorAll('#cartCompatContainer .compat-check:checked').forEach(cb => {
                                compat.push(cb.value);
                            });
                            console.log('پرینترهای انتخاب‌شده:', compat);
                            if (printer && !compat.includes(printer)) {
                                compat.push(printer);
                                console.log('پرینتر فعلی به لیست سازگار اضافه شد:', printer);
                            }

                            // اعتبارسنجی تاریخ
                            for (const d of [purchase, warranty]) {
                                if (d && jStrToTs(d) == null) {
                                    toast('فرمت تاریخ نامعتبر است: ' + d, 'err');
                                    return;
                                }
                            }

                            const obj = {
                                id: cart.id || null,
                                serialNumber: serial,
                                model,
                                brand,
                                compatiblePrinters: compat,
                                purchaseDate: purchase,
                                warrantyDate: warranty,
                                currentStatus: status,
                                currentPrinterId: printer,
                                currentLocation: location,
                                description: desc,
                                createdAt: cart.createdAt || null
                            };
                            console.log('داده‌های نهایی برای ذخیره:', obj);
                            await saveCartridge(obj, !id);
                            closeModal();
                            toast(isNew ? 'کارتریج جدید ثبت شد.' : 'کارتریج به‌روزرسانی شد.', 'ok');
                            render();
                        } catch (error) {
                            console.error('خطا در ذخیره کارتریج:', error);
                            toast('خطا: ' + (error.message || 'مشخص نیست'), 'err');
                        }
                    });
                }
            } catch (error) {
                console.error('خطا در باز کردن فرم کارتریج:', error);
                toast('خطا در باز کردن فرم: ' + error.message, 'err');
            }
        }

        // --- CARTRIDGE DELETE ---
        function confirmDeleteCartridge(id) {
            getCartridge(id).then(cart => {
                const root = $('#modalRoot');
                root.innerHTML =
                    '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                    '<div class="modal confirm" onclick="event.stopPropagation()">' +
                    '<div class="ci">' + icon('alert') + '</div>' +
                    '<h3>اسقاط کارتریج</h3>' +
                    '<p>آیا از اسقاط کارتریج سریال «' + esc((cart && cart.serialNumber) || 'این کارتریج') +
                    '» مطمئن هستید؟</p>' +
                    '<div class="row"><button class="btn btn-danger" id="cfDelCart">' + icon('trash') +
                    'اسقاط کن</button><button class="btn btn-secondary" id="cfCancelCart">انصراف</button></div></div></div>';
                $('#cfCancelCart').addEventListener('click', closeModal);
                $('#cfDelCart').addEventListener('click', async function() {
                    await deleteCartridge(id);
                    closeModal();
                    toast('کارتریج اسقاط شد.', 'warn');
                    render();
                });
            });
        }

        // --- CARTRIDGE DETAIL ---
        
        function openCartridgeDetail(id) {
            getCartridge(id).then(async cart => {
                if (!cart) { toast('کارتریج یافت نشد.', 'err'); return; }
                const printers = (await allDevices()).filter(d => d.type === 'printer');
                const printerMap = {};
                for (const p of printers) printerMap[p.id] = p;
                const history = await getCartridgeHistory(cart.id);
                const stats = await getCartridgeStats(cart.id);

                const root = $('#modalRoot');
                const di = (label, v) =>
                    `<div class="detail-item"><div class="dl">${label}</div><div class="dv">${v ? esc(v) : '—'}</div></div>`;

                const statusLabel = CARTRIDGE_STATUS[cart.currentStatus] ? CARTRIDGE_STATUS[cart.currentStatus].label :
                    cart.currentStatus;
                const currentPrinter = cart.currentPrinterId ? (printerMap[cart.currentPrinterId] ? printerMap[cart
                    .currentPrinterId].name : cart.currentPrinterId) : '—';

                root.innerHTML = `
                    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
                        <div class="modal" style="max-width:860px;" onclick="event.stopPropagation()">
                            <div class="modal-head">
                                <div class="mh-ico">${icon('eye')}</div>
                                <div><h3>جزئیات کارتریج</h3><div class="sp">سریال ${esc(cart.serialNumber)}</div></div>
                                <button class="btn-icon x" onclick="closeModal()">${icon('x')}</button>
                            </div>
                            <div class="modal-body">
                                <!-- مشخصات کارتریج -->
                                <div class="detail-grid">
                                    ${di('سریال', cart.serialNumber)}
                                    ${di('مدل', cart.model)}
                                    ${di('برند', cart.brand)}
                                    ${di('سازگار با', (cart.compatiblePrinters || []).map(id => printerMap[id] ? printerMap[id].name : id).join('، '))}
                                    ${di('تاریخ خرید', cart.purchaseDate)}
                                    ${di('گارانتی', cart.warrantyDate)}
                                    ${di('وضعیت', statusLabel)}
                                    ${di('پرینتر فعلی', currentPrinter)}
                                    ${di('محل فعلی', cart.currentLocation)}
                                    ${di('تاریخ ثبت', fmtDate(cart.createdAt))}
                                    ${di('تاریخ به‌روزرسانی', fmtDate(cart.updatedAt))}
                                </div>
                                ${cart.description ? `<div class="divider-h"></div><div class="detail-item"><div class="dl">توضیحات</div><div class="dv" style="white-space:pre-wrap;">${esc(cart.description)}</div></div>` : ''}
                                
                                <!-- آمار کارتریج -->
                                <div class="divider-h"></div>
                                <div class="section-title">${icon('stats')}آمار کارتریج</div>
                                <div class="detail-grid">
                                    ${di('تعداد شارژ', stats.rechargeCount)}
                                    ${di('تعداد نصب', stats.installCount)}
                                    ${di('مجموع هزینه', stats.totalCost + ' ریال')}
                                    ${di('آخرین عملیات', stats.lastOperation ? stats.lastOperation.type + ' در ' + fmtDate(stats.lastOperation.date) : '—')}
                                    ${di('آخرین شارژ', stats.lastRechargeDate ? fmtDate(stats.lastRechargeDate) : '—')}
                                    ${di('میانگین فاصله شارژ', stats.avgInterval ? Math.round(stats.avgInterval) + ' روز' : '—')}
                                </div>

                                <!-- ثبت عملیات جدید -->
                                <div class="divider-h"></div>
                                <div class="section-title">${icon('plus')}ثبت عملیات جدید</div>
                                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
                                    <button class="btn btn-secondary btn-sm" data-op="Install">نصب روی پرینتر</button>
                                    <button class="btn btn-secondary btn-sm" data-op="Remove">برداشتن از پرینتر</button>
                                    <button class="btn btn-secondary btn-sm" data-op="Transfer">انتقال به پرینتر دیگر</button>
                                    <button class="btn btn-secondary btn-sm" id="showServiceBtn">سرویس</button>
                                    <button class="btn btn-secondary btn-sm" data-op="Scrap">اسقاط</button>
                                </div>
                                <div id="serviceOptions" style="display:none;padding:10px;background:var(--surface-2);border-radius:8px;border:1px solid var(--border);margin-bottom:12px;">
                                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                                        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
                                            <input type="checkbox" class="service-check" value="Recharge"> شارژ
                                        </label>
                                        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
                                            <input type="checkbox" class="service-check" value="ReplaceDrum"> تعویض درام
                                        </label>
                                        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
                                            <input type="checkbox" class="service-check" value="ReplaceChip"> تعویض چیپ
                                        </label>
                                        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
                                            <input type="checkbox" class="service-check" value="Cleaning"> تمیزکاری
                                        </label>
                                    </div>
                                    <div style="margin-top:8px;">
                                        <button class="btn btn-primary btn-sm" id="serviceSubmitBtn">${icon('check')}ثبت سرویس‌های انتخاب‌شده</button>
                                        <button class="btn btn-secondary btn-sm" id="serviceCancelBtn">انصراف</button>
                                    </div>
                                </div>
                                <div id="opFormContainer"></div>

                                <!-- سوابق عملیات (بعد از ثبت عملیات جدید) -->
                                <div class="divider-h"></div>
                                <div class="section-title">${icon('history')}سوابق عملیات</div>
                                ${history.length ? `<div class="timeline">${history.map(h => `
                                    <div class="tl-item">
                                        <div class="tl-time">${fmtDate(h.date)} · ${new Date(h.createdAt).toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'})}</div>
                                        <div class="tl-title">${esc(h.operationType)}</div>
                                        <div class="tl-desc">${h.printerId ? 'پرینتر: ' + (printerMap[h.printerId] ? printerMap[h.printerId].name : h.printerId) : ''} ${h.technician ? 'تکنسین: ' + esc(h.technician) : ''} ${h.cost ? 'هزینه: ' + h.cost + ' ریال' : ''} ${h.description ? ' - ' + esc(h.description) : ''}</div>
                                    </div>
                                `).join('')}</div>` : `<div class="empty" style="padding:18px;">${icon('history')}<div class="et">هیچ عملیاتی ثبت نشده</div></div>`}
                            </div>
                            <div class="modal-foot">
                                <button class="btn btn-primary" onclick="closeModal();openCartridgeForm('${id}')">${icon('edit')}ویرایش</button>
                                <button class="btn btn-danger" onclick="confirmDeleteCartridge('${id}')">${icon('trash')}اسقاط</button>
                                <button class="btn btn-secondary" onclick="closeModal()">بستن</button>

                        </div>
                    </div>
                `;

                // ================================================================
                // نمایش/مخفی کردن گزینه‌های سرویس
                // ================================================================
                const showServiceBtn = $('#showServiceBtn');
                const serviceOptions = $('#serviceOptions');
                if (showServiceBtn && serviceOptions) {
                    showServiceBtn.addEventListener('click', function() {
                        const isVisible = serviceOptions.style.display !== 'none';
                        serviceOptions.style.display = isVisible ? 'none' : 'block';
                    });
                }

                // ================================================================
                // لغو سرویس
                // ================================================================
                const serviceCancelBtn = $('#serviceCancelBtn');
                if (serviceCancelBtn) {
                    serviceCancelBtn.addEventListener('click', function() {
                        serviceOptions.style.display = 'none';
                        document.querySelectorAll('.service-check').forEach(cb => cb.checked = false);
                    });
                }

                // ================================================================
                // ثبت سرویس‌های انتخاب‌شده
                // ================================================================
                const serviceSubmitBtn = $('#serviceSubmitBtn');
                if (serviceSubmitBtn) {
                    serviceSubmitBtn.addEventListener('click', async function() {
                        const selected = Array.from(document.querySelectorAll('.service-check:checked')).map(cb => cb.value);
                        if (selected.length === 0) {
                            toast('حداقل یک گزینه سرویس را انتخاب کنید.', 'err');
                            return;
                        }
                        showServiceForm(selected, cart, printers, $('#opFormContainer'));
                        serviceOptions.style.display = 'none';
                        document.querySelectorAll('.service-check').forEach(cb => cb.checked = false);
                    });
                }

                // ================================================================
                // دکمه‌های عملیات تکی
                // ================================================================
                const opButtons = root.querySelectorAll('[data-op]');
                opButtons.forEach(btn => {
                    btn.addEventListener('click', function() {

                            if (opType === 'Install') {

                            ${printerOpts}

                `;
            }

            container.innerHTML = `
                <div class="handover-form" style="margin-top:0;">
                    <div class="field"><label>تاریخ</label>
                        <div class="date-field">
                            <input id="opDate" class="input" value="${todayJ}" placeholder="سال/ماه/روز">
                            <button class="cal-btn" onclick="openDP(this.parentElement.querySelector('input'))">${icon('calendar')}</button>
                        </div>
                    </div>
                    <div class="field"><label>تکنسین</label><input id="opTechnician" class="input" placeholder="نام تکنسین"></div>
                    ${extraFields}
                    <div class="field span-2"><label>توضیحات</label><textarea id="opDesc" class="input" placeholder="توضیحات تکمیلی"></textarea></div>
                    <div class="span-2" style="display:flex;gap:8px;">
                        <button class="btn btn-primary" id="opSubmitMulti">${icon('check')}ثبت عملیات‌های انتخاب‌شده</button>
                        <button class="btn btn-secondary" id="opCancelMulti">انصراف</button>
                    </div>
                </div>
            `;

            const cancelBtn = $('#opCancelMulti');
            if (cancelBtn) cancelBtn.addEventListener('click', function() {
                container.innerHTML = '';
                // لغو انتخاب چک‌باکس‌ها
                document.querySelectorAll('.op-check').forEach(cb => cb.checked = false);
            });

            const submitBtn = $('#opSubmitMulti');
            if (submitBtn) {
                submitBtn.addEventListener('click', async function() {
                    try {
                        const date = $('#opDate').value.trim();
                        if (!date || jStrToTs(date) == null) {
                            toast('تاریخ نامعتبر است.', 'err');
                            return;
                        }
                        const technician = $('#opTechnician').value.trim() || 'نامشخص';
                        const cost = parseInt($('#opCost')?.value || '0') || 0;
                        const description = $('#opDesc').value.trim() || '';
                        let printerId = null;

                        // اگر نیاز به پرینتر داریم
                        if (needsPrinter) {
                            printerId = $('#opPrinter').value || null;
                            if (!printerId) {
                                toast('پرینتر مقصد را انتخاب کنید.', 'err');
                                return;
                            }
                            // بررسی سازگاری برای عملیات Install
                            if (selectedOps.includes('Install')) {
                                const printer = printers.find(p => p.id === printerId);
                                if (printer) {
                                    const compatible = cart.compatiblePrinters || [];
                                    if (!compatible.includes(printerId) && !compatible.includes(printer.model)) {
                                        if (!confirm('مدل کارتریج با پرینتر انتخاب‌شده سازگار نیست. آیا ادامه می‌دهید؟')) {
                                            return;
                                        }
                                    }
                                }
                            }
                        }

                        // اگر عملیات Remove انتخاب شده و کارتریج پرینتر ندارد
                        if (isRemove && !cart.currentPrinterId) {
                            toast('کارتریج روی پرینتری نصب نیست.', 'warn');
                            return;
                        }

                        // اگر اسقاط انتخاب شده
                        if (isScrap) {
                            if (!confirm('آیا از اسقاط کارتریج سریال ' + cart.serialNumber + ' مطمئن هستید؟')) {
                                return;
                            }
                        }

                        // ثبت هر عملیات به صورت جداگانه
                        const timestamp = jStrToTs(date);
                        const records = [];
                        for (const op of selectedOps) {
                            let recPrinterId = null;
                            if (op === 'Install' || op === 'Transfer') {
                                recPrinterId = printerId;
                            } else if (op === 'Remove') {
                                recPrinterId = cart.currentPrinterId;
                            }
                            // برای سایر عملیات، پرینتر را خالی می‌گذاریم یا از پرینتر فعلی استفاده می‌کنیم
                            if (op === 'Recharge' || op === 'Repair' || op === 'ReplaceChip' || 
                                op === 'ReplaceDrum' || op === 'Cleaning' || op === 'Scrap') {
                                // برای این عملیات‌ها، پرینتر را خالی می‌گذاریم (می‌توانید در صورت نیاز تغییر دهید)
                                recPrinterId = null;
                            }

                            const record = {
                                cartridgeId: cart.id,
                                cartridgeSerial: cart.serialNumber,
                                operationType: op,
                                date: timestamp,
                                printerId: recPrinterId,
                                technician: technician,
                                cost: (op === 'Recharge' || op === 'Repair' || op === 'ReplaceChip' || 
                                    op === 'ReplaceDrum' || op === 'Cleaning') ? cost : 0,
                                description: description || (op === 'Scrap' ? 'اسقاط کارتریج' : ''),
                                createdAt: Date.now()
                            };
                            records.push(record);
                            await addCartridgeHistory(record);
                        }

                        // به‌روزرسانی وضعیت کارتریج
                        let newStatus = cart.currentStatus;
                        let newPrinterId = cart.currentPrinterId;

                        if (selectedOps.includes('Install') || selectedOps.includes('Transfer')) {
                            newPrinterId = printerId;
                            newStatus = 'inUse';
                        }
                        if (selectedOps.includes('Remove')) {
                            newPrinterId = null;
                            newStatus = 'ready';
                        }
                        if (selectedOps.includes('Recharge')) {
                            newStatus = 'recharged';
                        }
                        if (selectedOps.includes('Scrap')) {
                            newStatus = 'scrapped';
                            newPrinterId = null;
                        }
                        // اگر تعمیر یا تعویض قطعه باشد، وضعیت تغییر نمی‌کند (مگر اینکه اسقاط هم انتخاب شده باشد)

                        // اعمال تغییرات روی کارتریج
                        cart.currentStatus = newStatus;
                        if (newPrinterId !== undefined) cart.currentPrinterId = newPrinterId;
                        await dbPut('cartridges', cart);

                        toast(records.length + ' عملیات با موفقیت ثبت شد.', 'ok');
                        container.innerHTML = '';
                        // لغو انتخاب چک‌باکس‌ها
                        document.querySelectorAll('.op-check').forEach(cb => cb.checked = false);
                        // رفرش جزئیات
                        openCartridgeDetail(cart.id);
                    } catch (error) {
                        console.error('خطا در ثبت عملیات:', error);
                        toast('خطا: ' + (error.message || 'مشخص نیست'), 'err');
                    }
                });
            }
        }

        // --- HISTORY (unchanged) ---
        async function viewHistory(c) {
            const logs = await allLogs();
            const devs = await allDevices();
            const devMap = {};
            devs.forEach(d => devMap[d.id] = d);
            const devOpts = ['<option value="">همه دیوایس‌ها</option>'].concat(devs.map(d =>
                '<option value="' + d.id + '">' + esc(d.name || 'بدون‌نام') + '</option>')).join('');
            c.innerHTML =
                '<div class="view">' +
                '<div class="toolbar"><select class="select filter-select" id="histDev" style="min-width:220px;">' +
                devOpts + '</select>' +
                '<input id="histQ" class="input search-box" style="position:relative;max-width:340px;" placeholder="جستجو در توضیحات…">' +
                '<div class="right"><button class="btn btn-secondary btn-sm" id="histClear">' + icon(
                    'x') + 'پاک‌سازی</button></div></div>' +
                '<div class="card card-pad">' +
                (logs.length ?
                    '<div class="timeline" id="histBody"></div>' :
                    '<div class="empty">' + icon('history') +
                    '<div class="et">هیچ لاگی ثبت نشده</div></div>') +
                '</div></div>';

            function renderHist() {
                const body = $('#histBody');
                if (!body) return;
                let q = ($('#histQ').value || '').trim().toLowerCase();
                let devF = $('#histDev').value;
                let list = logs.filter(l => {
                    if (devF && l.deviceId !== devF) return false;
                    if (q && !(l.action + ' ' + l.description).toLowerCase().includes(q)) return false;
                    return true;
                });
                if (!list.length) { body.innerHTML = '<div class="empty" style="padding:20px;">' + icon(
                        'search') + '<div class="et">موردی یافت نشد</div></div>'; return; }
                body.innerHTML = list.map(l => {
                    const d = devMap[l.deviceId];
                    return '<div class="tl-item"><div class="tl-time">' + esc(l.dateJ) + ' · ' +
                        new Date(l.ts).toLocaleTimeString('fa-IR', { hour: '2-digit',
                            minute: '2-digit' }) + '</div>' +
                        '<div class="tl-title">' + esc(l.action) + (d ? ' <span class="tl-dev" data-id="' +
                            d.id + '">· «' + esc(d.name || '') + '»</span>' : '') +
                        '</div><div class="tl-desc">' + esc(l.description) + '</div></div>';
                }).join('');
                $$('.tl-dev', body).forEach(el => el.addEventListener('click', function() {
                    openDetail(this.dataset.id);
                }));
            }

            const histDev = $('#histDev');
            if (histDev) histDev.addEventListener('change', renderHist);

            const histQ = $('#histQ');
            if (histQ) histQ.addEventListener('input', renderHist);

            const histClear = $('#histClear');
            if (histClear) {
                histClear.addEventListener('click', function() {
                    $('#histQ').value = '';
                    $('#histDev').value = '';
                    renderHist();
                });
            }

            if ($('#histBody')) renderHist();
        }

        function exportCSV(list) {
            const headers = ['نام', 'نوع', 'وضعیت', 'برچسب‌ها', 'سریال', 'MAC', 'IP', 'برند', 'مدل', 'سازنده', 'محل',
                'اتاق', 'طبقه', 'خرید', 'گارانتی', 'سرویس', 'مسئول', 'یادداشت'
            ];
            const rows = list.map(d => [
                d.name, deviceTypesMap[d.type] ? deviceTypesMap[d.type].label : d.type, STATUS[d.status] ?
                STATUS[d.status].label : d.status, (d.tags || []).join(' | '),
                d.serial, d.mac, d.ip, d.brand, d.model, d.manufacturer, d.location, d.room, d.floor,
                d.purchaseDate, d.warrantyDate, d.lastService, d.assignedTo, (d.notes || '').replace(/\n/g,
                    ' ')
            ]);
            const escCsv = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,
                        '""') + '"' : v; };
            const csv = String.fromCharCode(0xFEFF) + [headers, ...rows].map(r => r.map(escCsv).join(',')).join(
                '\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            downloadBlob(blob, 'it-assets-' + jNowStr().replace(/\//g, '-') + '.csv');
            toast('فایل CSV ذخیره شد.', 'ok');
        }

        function setJsonBinStatus(type, text) {
            const el = $('#jsonBinStatus');
            if (!el) return;
            const styles = {
                ok: { bg: 'var(--ok-soft)', color: '#34d399', border: 'rgba(16,185,129,.3)', dot: 'var(--ok)' },
                err: { bg: 'var(--bad-soft)', color: '#f87171', border: 'rgba(239,68,68,.3)', dot: 'var(--bad)' },
                warn: { bg: 'var(--warn-soft)', color: '#fbbf24', border: 'rgba(245,158,11,.3)', dot: 'var(--warn)' },
                loading: { bg: 'var(--muted-soft)', color: 'var(--text-2)', border: 'var(--border)', dot: 'var(--muted)' }
            };
            const st = styles[type] || styles.loading;
            el.textContent = '● ' + text;
            el.style.background = st.bg;
            el.style.color = st.color;
            el.style.borderColor = st.border;
            el.dataset.state = type;
        }

        async function jsonBinRequest(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_CONFIG.masterKey,
                'X-Access-Key': JSONBIN_CONFIG.accessKey
            };
            const response = await fetch(JSONBIN_CONFIG.baseUrl + path, {
                ...options,
                headers
            });
            let body = null;
            const text = await response.text();
            try { body = text ? JSON.parse(text) : null; } catch (_) { body = text; }
            if (!response.ok) {
                const detail = body && body.message ? body.message : ('HTTP ' + response.status);
                throw new Error(detail);
            }
            return body;
        }

        async function checkJsonBinConnection(showToast = false) {
            setJsonBinStatus('loading', 'در حال اتصال به JSONBin...');
            try {
                await jsonBinRequest('/b/' + encodeURIComponent(JSONBIN_CONFIG.binId) + '/latest', {
                    method: 'GET',
                    headers: { 'X-Bin-Meta': 'false' }
                });
                setJsonBinStatus('ok', 'JSONBin متصل است');
                if (showToast) toast('اتصال به JSONBin برقرار است.', 'ok');
                return true;
            } catch (err) {
                setJsonBinStatus('err', 'اتصال JSONBin ناموفق');
                console.error('JSONBin connection error:', err);
                if (showToast) toast('اتصال به JSONBin برقرار نشد: ' + err.message, 'err');
                return false;
            }
        }

        async function collectBackupData() {
            const devices = await allDevices();
            const logs = await allLogs();

            const customFields = await dbAll('customFields');
            const assignments = await dbAll('assignments');
            const cartridges = await allCartridges();
            const cartridgeHistory = await dbAll('cartridgeHistory');
            return {
                version: 6,
                exportedAt: new Date().toISOString(),
                dateJ: jNowStr(),
                devices,
                logs,
                customTypes,
                customFields,
                assignments,
                cartridges,

        }

        async function backupToJsonBin() {
            const btn = $('#jsonBinBackupBtn');
            if (btn) btn.disabled = true;
            try {
                setJsonBinStatus('loading', 'در حال ارسال بک‌آپ...');
                const data = await collectBackupData();
                const json = JSON.stringify(data);
                const bytes = new Blob([json]).size;

                // JSONBin Free plan has a 100 KB record limit according to current docs.
                if (bytes > 100 * 1024) {
                    throw new Error('حجم بک‌آپ حدود ' + Math.ceil(bytes / 1024) + ' KB است و از سقف 100 KB پلن رایگان JSONBin بیشتر است.');
                }

                await jsonBinRequest('/b/' + encodeURIComponent(JSONBIN_CONFIG.binId), {
                    method: 'PUT',
                    headers: { 'X-Bin-Versioning': 'true' },
                    body: json
                });
                setJsonBinStatus('ok', 'آخرین بک‌آپ در JSONBin ذخیره شد');
                toast('بک‌آپ با موفقیت در JSONBin ذخیره شد.', 'ok');
            } catch (err) {
                console.error('JSONBin backup error:', err);
                setJsonBinStatus('err', 'خطا در بک‌آپ JSONBin');
                toast('خطا در بک‌آپ JSONBin: ' + err.message, 'err');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function restoreDataObject(data) {
            if (!data || !Array.isArray(data.devices) || !data.version) {
                throw new Error('ساختار بک‌آپ نامعتبر است.');
            }
            await dbClear('devices');
            await dbClear('logs');
            await dbClear('customTypes');
            await dbClear('customFields');
            await dbClear('assignments');
            await dbClear('cartridges');
            await dbClear('cartridgeHistory');
            for (const d of data.devices) await dbPut('devices', d);
            for (const l of data.logs || []) await dbPut('logs', l);
            for (const ct of data.customTypes || []) await dbPut('customTypes', ct);
            for (const cf of data.customFields || []) await dbPut('customFields', cf);
            for (const a of data.assignments || []) await dbPut('assignments', a);
            for (const c of data.cartridges || []) await dbPut('cartridges', c);
            for (const h of data.cartridgeHistory || []) await dbPut('cartridgeHistory', h);
            hasDataFlag = true;
        }

        async function restoreFromJsonBin() {
            const btn = $('#jsonBinRestoreBtn');
            if (btn) btn.disabled = true;
            try {
                setJsonBinStatus('loading', 'در حال دریافت بک‌آپ...');
                const payload = await jsonBinRequest('/b/' + encodeURIComponent(JSONBIN_CONFIG.binId) + '/latest', {
                    method: 'GET',
                    headers: { 'X-Bin-Meta': 'false' }
                });
                const data = payload && payload.record ? payload.record : payload;
                if (!data || !Array.isArray(data.devices) || !data.version) {
                    throw new Error('بک‌آپ موجود در JSONBin معتبر نیست.');
                }
                const deviceCount = data.devices.length;
                const cartridgeCount = Array.isArray(data.cartridges) ? data.cartridges.length : 0;
                if (!confirm('همه داده‌های فعلی بازنویسی می‌شوند.\n\nبک‌آپ JSONBin شامل ' + deviceCount + ' دیوایس و ' + cartridgeCount + ' کارتریج است.\n\nادامه می‌دهید؟')) return;
                await restoreDataObject(data);
                setJsonBinStatus('ok', 'اتصال برقرار است · بک‌آپ بازیابی شد');
                toast('بک‌آپ JSONBin با موفقیت بازیابی شد.', 'ok');

            } catch (err) {

                setJsonBinStatus('err', 'خطا در بازیابی JSONBin');
                toast('خطا در بازیابی JSONBin: ' + err.message, 'err');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function backupAll() {
            const data = await collectBackupData();

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const settings = JSON.parse(localStorage.getItem('appSettings') || '{}');
            const prefix = settings.backupPrefix || 'backup';
            const name = prefix + '-' + jNowStr().replace(/\//g, '-') + '.json';

            if (window.showDirectoryPicker) {
                try {
                    const handle = await window.showDirectoryPicker({
                        id: 'backupDir',
                        mode: 'readwrite'
                    });
                    const fileHandle = await handle.getFileHandle(name, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    toast('بک‌آپ در پوشه "' + handle.name + '" ذخیره شد.', 'ok');
                    return;
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        toast('خطا در ذخیره در پوشه: ' + err.message + ' → ذخیره در Downloads', 'warn');
                    } else {
                        downloadBlob(blob, name);
                        toast('بک‌آپ در Downloads ذخیره شد.', 'ok');
                        return;
                    }
                }
            }
            downloadBlob(blob, name);
            toast('بک‌آپ در Downloads ذخیره شد.', 'ok');
        }

        function restoreBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = async function() {
                const file = this.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!data.devices || !data.version) { toast('فایل نامعتبر است.', 'err'); return; }
                    if (!confirm('همه داده‌های فعلی بازنویسی می‌شوند. ادامه؟')) return;
                    await restoreDataObject(data);
                    toast('بازیابی موفق.', 'ok');
                    await render();
                } catch (err) { toast('خطا: ' + err.message, 'err'); }
            };
            input.click();
        }

                                    <option value="light" ${document.documentElement.getAttribute('data-theme') === 'light' ? 'selected' : ''}>روشن</option>
                                </select>
                                <button class="btn btn-secondary btn-sm" id="applyThemeBtn">اعمال</button>
                            </div>
                        </div>
                        <div class="settings-group" style="border-bottom:none;margin-bottom:0;">
                            <div class="sg-title">${icon('info')}درباره</div>
                            <div class="sg-row"><label>نسخه</label><span class="sg-value">2.1</span></div>
                            <div class="sg-row"><label>ذخیره‌سازی</label><span class="sg-value">IndexedDB (محلی)</span></div>
                            <div class="sg-row"><label>تعداد دیوایس‌ها</label><span class="sg-value" id="deviceCountStat">0</span></div>
                        </div>
                    </div>
                </div>
            `;

            // Update data status
            const devs = await allDevices();
            const carts = await allCartridges();
            const statusEl = $('#dataStatus');
            if (statusEl) statusEl.textContent = devs.length + ' دیوایس، ' + carts.length + ' کارتریج';
            const countEl = $('#deviceCountStat');
            if (countEl) countEl.textContent = devs.length;

            // Event listeners
            const saveTimeBtn = $('#saveTimeSettings');
            if (saveTimeBtn) {
                saveTimeBtn.addEventListener('click', function() {
                    const settings = JSON.parse(localStorage.getItem('appSettings') || '{}');
                    settings.dateFormat = $('#dateFormat').value;
                    localStorage.setItem('appSettings', JSON.stringify(settings));
                    toast('تنظیمات ذخیره شد.', 'ok');
                    tickClock();
                });
            }

            const saveBackupBtn = $('#saveBackupSettings');
            if (saveBackupBtn) {
                saveBackupBtn.addEventListener('click', function() {
                    const settings = JSON.parse(localStorage.getItem('appSettings') || '{}');
                    settings.backupPrefix = $('#backupPrefix').value.trim() || 'backup';
                    localStorage.setItem('appSettings', JSON.stringify(settings));
                    toast('تنظیمات بک‌آپ ذخیره شد.', 'ok');
                });
            }

            const selectDirBtn = $('#selectBackupDirBtn');
            if (selectDirBtn) {
                selectDirBtn.addEventListener('click', async function() {
                    if (window.showDirectoryPicker) {
                        try {
                            const handle = await window.showDirectoryPicker({
                                id: 'backupDir',
                                mode: 'readwrite'
                            });
                            localStorage.setItem('backupDirName', handle.name);
                            toast('پوشه بک‌آپ انتخاب شد: ' + handle.name, 'ok');
                            viewSettings(c);
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                toast('خطا در انتخاب پوشه: ' + err.message, 'err');
                            }
                        }
                    } else {
                        toast('مرورگر شما از انتخاب پوشه پشتیبانی نمی‌کند.', 'warn');
                    }
                });
            }

            const clearDirBtn = $('#clearBackupDirBtn');
            if (clearDirBtn) {
                clearDirBtn.addEventListener('click', function() {
                    localStorage.removeItem('backupDirName');
                    toast('پوشه بک‌آپ حذف شد. فایل‌ها در Downloads ذخیره می‌شوند.', 'warn');
                    viewSettings(c);
                });
            }

            const manualBackup = $('#manualBackupBtn');
            if (manualBackup) manualBackup.addEventListener('click', backupAll);

            const settingsJsonBinBackup = $('#settingsJsonBinBackupBtn');
            if (settingsJsonBinBackup) settingsJsonBinBackup.addEventListener('click', backupToJsonBin);

            const settingsJsonBinRestore = $('#settingsJsonBinRestoreBtn');
            if (settingsJsonBinRestore) settingsJsonBinRestore.addEventListener('click', restoreFromJsonBin);

            const settingsJsonBinCheck = $('#settingsJsonBinCheckBtn');
            if (settingsJsonBinCheck) settingsJsonBinCheck.addEventListener('click', () => checkJsonBinConnection(true));

            const seedBtn = $('#seedFromSettings');
            if (seedBtn) seedBtn.addEventListener('click', seedSample);

            const clearDataBtn = $('#clearAllData');
            if (clearDataBtn) {
                clearDataBtn.addEventListener('click', function() {
                    if (confirm('⚠️ هشدار! این عمل تمام داده‌ها را به‌طور کامل حذف می‌کند. آیا مطمئن هستید؟')) {
                        if (confirm('تأیید نهایی: تمام دیوایس‌ها، کارتریج‌ها و تاریخچه پاک می‌شوند. ادامه؟')) {
                            dbClear('devices').then(() => {
                                dbClear('logs');
                                dbClear('assignments');
                                dbClear('cartridges');
                                dbClear('cartridgeHistory');
                                hasDataFlag = false;
                                toast('همه داده‌ها پاک شدند.', 'warn');
                                render();
                            });
                        }
                    }
                });
            }

            const applyTheme = $('#applyThemeBtn');
            if (applyTheme) {
                applyTheme.addEventListener('click', function() {
                    const theme = $('#themeSelect').value;
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    const toggleBtn = $('#themeToggle');
                    if (toggleBtn) toggleBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
                    toast('تم تغییر کرد.', 'ok');
                });
            }
        }

        // --- SEED (updated with new cartridge schema) ---
        async function seedSample() {
            if ((await allDevices()).length > 0) {
                if (!confirm('داده نمونه اضافه شود؟')) return;
            }
            const now = Date.now();
            const samples = [
                { name: 'WS-FIN-01', type: 'system', tags: ['لپ‌تاپ', 'مالی'], serial: 'SN-DEL-7090',
                    mac: '1C:69:7A:22:10:01', ip: '192.168.1.21', brand: 'Dell', model: 'OptiPlex 7090',
                    manufacturer: 'Dell Inc.', location: 'دفتر مرکزی', room: 'مالی', floor: '۲',
                    purchaseDate: '1402/09/15', warrantyDate: '1405/09/15', lastService: '1403/11/20',
                    status: 'active', assignedTo: 'حسین رضایی', notes: 'ایستگاه کاری واحد مالی.',
                    hardDrives: [{ size: '931.51', model: 'WDC WD10EZEX-00BBHA0', serialNumber: 'WD-WCC6Y7YZ8VCN',
                        type: 'IDE' }],
                    ramModules: [{ speed: '2133', capacity: '16', manufacturer: 'Corsair',
                        partNumber: 'CMK32GX4M2E3200C16' }],
                    networkCards: [{ macAddress: '04:42:1A:0A:B3:95', name: 'Realtek Gaming 2.5GbE' }],
                    motherboard: { serialNumber: '210889484201930', manufacturer: 'ASUSTeK COMPUTER INC.',
                        product: 'TUF GAMING B560-PLUS WIFI' },
                    mouse: true, keyboard: true, other: 'شماره اموال: 0400000219'
                },
                { name: 'SRV-APP-01', type: 'server', tags: ['سرور', 'حیاتی'], serial: 'SN-HP-DL380',
                    mac: '2C:44:FD:11:90:02', ip: '10.0.0.10', brand: 'HPE', model: 'ProLiant DL380 Gen10',
                    manufacturer: 'HPE', location: 'اتاق سرور', room: 'S1', floor: 'زیرزمین',
                    purchaseDate: '1401/03/10', warrantyDate: '1406/03/10', lastService: '1403/09/01',
                    status: 'active', assignedTo: 'تیم زیرساخت', notes: 'سرور برنامه‌های داخلی.',
                    hardDrives: [{ size: '931.51', model: 'WD Blue SN570 1TB', serialNumber: 'E823_8FA6_BF53',
                        type: 'SCSI' }],
                    ramModules: [{ speed: '2133', capacity: '16', manufacturer: 'Corsair',
                        partNumber: 'CMK32GX4M2E3200C16' }],
                    networkCards: [{ macAddress: '04:42:1A:0A:B3:95', name: 'Realtek Gaming 2.5GbE' }],
                    motherboard: { serialNumber: '210889484201930', manufacturer: 'ASUSTeK COMPUTER INC.',
                        product: 'TUF GAMING B560-PLUS WIFI' },
                    mouse: false, keyboard: false, other: ''
                },
                { name: 'PRT-HR-01', type: 'printer', tags: ['پرینتر', 'منابع‌انسانی'], serial: 'SN-HP-M404',
                    mac: '3C:52:82:00:7A:03', ip: '192.168.2.30', brand: 'HP', model: 'LaserJet Pro M404',
                    manufacturer: 'HP', location: 'دفتر مرکزی', room: 'منابع انسانی', floor: '۲',
                    purchaseDate: '1402/05/22', warrantyDate: '1404/05/22', lastService: '1403/10/12',
                    status: 'repair', assignedTo: 'منابع انسانی', notes: 'نیازمند تعویض درام.' }
            ];
            for (const s of samples) { s.id = uuid();
                s.createdAt = now - Math.floor(Math.random() * 90000000);
                s.customFields = {};
                if (!s.hardDrives) s.hardDrives = [];
                if (!s.ramModules) s.ramModules = [];
                if (!s.networkCards) s.networkCards = [];
                if (!s.motherboard) s.motherboard = {};
                if (s.mouse === undefined) s.mouse = false;
                if (s.keyboard === undefined) s.keyboard = false;
                if (!s.other) s.other = '';
                await dbPut('devices', s);
                await addLog(s.id, 'ایجاد', 'دیوایس «' + s.name + '» (داده نمونه) ایجاد شد.');
            }
            // Create cartridges sample
            const printers = samples.filter(d => d.type === 'printer');
            const cartSamples = [
                { serialNumber: 'HP85A-01', model: 'HP85A', brand: 'HP', compatiblePrinters: printers.map(p => p
                        .id), purchaseDate: '1402/11/01', warrantyDate: '1404/11/01', currentStatus: 'inUse',
                    currentPrinterId: printers.length ? printers[0].id : null, currentLocation: 'دفتر مرکزی',
                    description: 'کارتریج اصلی.' },
                { serialNumber: 'CF283A-04', model: 'CF283A', brand: 'HP', compatiblePrinters: printers.map(p =>
                        p.id), purchaseDate: '1402/12/01', warrantyDate: '1404/12/01', currentStatus: 'ready',
                    currentPrinterId: null, currentLocation: 'انبار', description: 'کارتریج یدک.' }
            ];
            for (const cs of cartSamples) {
                cs.id = uuid();
                cs.createdAt = now - Math.floor(Math.random() * 30000000);
                await dbPut('cartridges', cs);
                // Create some history
                if (cs.serialNumber === 'HP85A-01') {
                    await addCartridgeHistory({
                        cartridgeId: cs.id,
                        cartridgeSerial: cs.serialNumber,
                        operationType: 'Purchase',
                        date: jStrToTs('1402/11/01'),
                        printerId: null,
                        technician: 'سامانه',
                        cost: 0,
                        description: 'خرید کارتریج',
                        createdAt: now - 20000000
                    });
                    await addCartridgeHistory({
                        cartridgeId: cs.id,
                        cartridgeSerial: cs.serialNumber,
                        operationType: 'Install',
                        date: jStrToTs('1402/11/15'),
                        printerId: printers.length ? printers[0].id : null,
                        technician: 'تکنسین نمونه',
                        cost: 0,
                        description: 'نصب اولیه روی پرینتر',
                        createdAt: now - 15000000
                    });
                    await addCartridgeHistory({
                        cartridgeId: cs.id,
                        cartridgeSerial: cs.serialNumber,
                        operationType: 'Recharge',
                        date: jStrToTs('1403/04/20'),
                        printerId: printers.length ? printers[0].id : null,
                        technician: 'تکنسین نمونه',
                        cost: 50000,
                        description: 'شارژ مجدد',
                        createdAt: now - 5000000
                    });
                }
                if (cs.serialNumber === 'CF283A-04') {
                    await addCartridgeHistory({
                        cartridgeId: cs.id,
                        cartridgeSerial: cs.serialNumber,
                        operationType: 'Purchase',
                        date: jStrToTs('1402/12/01'),
                        printerId: null,
                        technician: 'سامانه',
                        cost: 0,
                        description: 'خرید کارتریج یدک',
                        createdAt: now - 25000000
                    });
                }
            }
            hasDataFlag = true;
            toast(samples.length + ' دیوایس و ' + cartSamples.length + ' کارتریج نمونه اضافه شد.', 'ok');
            render();
        }

        // ================================================================
        // INIT
        // ================================================================
        function updateDbStat() {
            return allDevices().then(d => {
                const el = $('#dbStat');
                if (el) el.textContent = '— ' + d.length + ' دیوایس ثبت‌شده';
            }).catch(() => {});
        }

        
        function tickClock() {
            const el = $('#clock');
            if (!el) return;
            try {
                const now = new Date();
                const settings = JSON.parse(localStorage.getItem('appSettings') || '{}');
                const date = settings.dateFormat === 'gregorian'
                    ? new Intl.DateTimeFormat('en-GB', {
                        weekday: 'long',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }).format(now)
                    : new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
                        weekday: 'long',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }).format(now);
                const time = new Intl.DateTimeFormat('fa-IR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(now);
                el.textContent = date + ' · ' + time;
            } catch (e) { /* silent*/ }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            const btn = $('#themeToggle');
            if (btn) btn.textContent = next === 'dark' ? '🌙' : '☀️';
        }

        window.addEventListener('beforeunload', function(e) {
            if (hasDataFlag) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if ($('#dpRoot').firstChild) { closeDP(); return; }
                if ($('#modalRoot').firstChild) { closeModal(); return; }
            }
            const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
            if (typing) {
                if (e.key === 'Enter' && document.activeElement.id === 'searchInput') {
                    renderDevBody();
                }
                return;
            }
            if (e.key === '/' && !typing) {
                e.preventDefault();
                const s = $('#searchInput');
                if (s) s.focus();
                return;
            }
            if ((e.altKey) && (e.key >= '1' && e.key <= '5')) {
                const routes = ['dashboard', 'devices', 'tags', 'history', 'reports'];
                navigate(routes[+e.key - 1]);
                return;
            }
            if (e.key === '6' && e.altKey) { navigate('cartridges'); return; }
            if (e.key === '7' && e.altKey) { navigate('settings'); return; }
            if (e.key === 'n' || e.key === 'N') {
                if (STATE.route === 'devices') {
                    e.preventDefault();
                    openDeviceForm(null);
                }
                if (STATE.route === 'cartridges') {
                    e.preventDefault();
                    openCartridgeForm(null);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', async function() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const btn = $('#themeToggle');
            if (btn) btn.textContent = saved === 'dark' ? '🌙' : '☀️';
            btn.addEventListener('click', toggleTheme);

            // Backup buttons in header
            const backupBtn = $('#backupBtn');
            if (backupBtn) backupBtn.addEventListener('click', backupAll);
            const jsonBinBackupBtn = $('#jsonBinBackupBtn');
            if (jsonBinBackupBtn) jsonBinBackupBtn.addEventListener('click', backupToJsonBin);
            const jsonBinRestoreBtn = $('#jsonBinRestoreBtn');
            if (jsonBinRestoreBtn) jsonBinRestoreBtn.addEventListener('click', restoreFromJsonBin);

            setNavIcons();
            $$('.nav-item').forEach(n => n.addEventListener('click', function() {
                navigate(this.dataset.route);
            }));

            await openDB();
            const devs = await allDevices();
            hasDataFlag = devs.length > 0;

            // Check JSONBin connectivity at application startup without blocking local usage.
            checkJsonBinConnection(false);

            navigate('dashboard');
            tickClock();
            setInterval(tickClock, 1000);
        });
    </script>
</body>
